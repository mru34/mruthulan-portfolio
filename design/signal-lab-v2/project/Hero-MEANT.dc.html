<style>
*{box-sizing:border-box}
body{margin:0;background:#07090E;color:#E9ECF2;font-family:"Spline Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.form{width:100%;height:100%;overflow:visible}
.node{position:absolute;display:flex;flex-direction:column;align-items:center;gap:9px;padding:6px;transform:translate(-50%,-50%) scale(var(--s));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.plate{width:56px;height:56px;border-radius:50%;border:1px solid #242C3A;background:linear-gradient(160deg,#131924,#0A0D14);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 24px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.plate svg{width:30px;height:30px;fill:none;stroke:#8B94A6;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.node-name{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#7E8899;white-space:nowrap}
.node.sel{transform:translate(-50%,-50%) scale(calc(var(--s) * 1.34)) translateY(-12px)}
.node.sel .plate{border-color:var(--acc);background:linear-gradient(160deg,#1C1608,#090C12);box-shadow:0 0 0 1px var(--acc),0 0 32px var(--acc-glow),inset 0 1px 0 rgba(255,255,255,.1)}
.node.sel .plate svg{stroke:var(--acc)}
.node.sel .node-name{color:#E9ECF2}
.node-tick{position:absolute;left:50%;top:calc(50% + 46px);width:1px;height:40px;background:linear-gradient(to bottom,var(--acc),transparent);transform:translateX(-50%)}
.readout{position:absolute;left:0;right:0;bottom:-30px;display:flex;align-items:flex-end;gap:28px;padding:22px 26px 22px 24px;border-top:1px solid #1B2230;background:linear-gradient(to right,rgba(12,16,23,.9),rgba(12,16,23,0))}
.readout:before{content:"";position:absolute;left:0;top:-1px;width:120px;height:2px;background:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border:1px solid var(--acc);border-radius:999px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.cta{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;background:var(--acc);color:#07090E;font-weight:600;font-size:15px}
.ghost{display:inline-flex;align-items:center;gap:9px;padding:13px 20px;border-radius:999px;border:1px solid #2A3342;font-size:15px}
@media (prefers-reduced-motion: no-preference){
@keyframes drift{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-14px,0)}}
@keyframes breathe{0%,100%{opacity:.32}50%{opacity:.62}}
@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes caret{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
.form-wrap{animation:drift 9s ease-in-out infinite}
.pulse{animation:breathe 4.4s ease-in-out infinite}
.riser{animation:rise 4.6s ease-in-out infinite}
.caret{animation:caret 1.15s steps(1,end) infinite}
}
