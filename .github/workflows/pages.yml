# Checks the site and publishes it to mruthulan.com. Only the pages and what they load are
# published (the HTML pages, css/, js/, assets/, robots.txt, sitemap.xml): the generator,
# design files, data and notes stay in the repository and off the website.
name: Check and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - run: pip install pillow==12.3.0

      - name: The committed pages are what the generator writes
        run: |
          python design/build_site.py
          python design/check_site.py --unchanged
          git checkout -- .

      - name: Collect the public files
        run: |
          mkdir _site
          cp ./*.html CNAME robots.txt sitemap.xml _site/
          cp -r css js assets _site/

      - name: Every link and image on every page resolves
        run: python design/check_site.py _site

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
